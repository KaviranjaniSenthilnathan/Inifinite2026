<!DOCTYPE html>
<html>
<head>
    <title>Question 2</title>
</head>
<body>

    <h2>Odd or Even</h2>

    <script>

for(let i = 0; i <= 15; i++) {

    if(i % 2 == 0) {
        document.write(i + " is even <br>");
    }
    else {
        document.write(i + " is odd <br>");
    }

}

    </script>

</body>
</html>
